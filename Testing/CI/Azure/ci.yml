variables:
  ITKv5_VERSION: v5.4.6
  ITK_GIT_URL: https://github.com/InsightSoftwareConsortium/ITK
  ITKIMPACT_SOURCE_DIR: $(Agent.BuildDirectory)/ITKIMPACT
  ITK_SOURCE_DIR: $(Agent.BuildDirectory)/ITK-source
  ITK_BINARY_DIR: $(Agent.BuildDirectory)/ITK-build
  ELASTIX_SOURCE_DIR: $(Build.Repository.LocalPath)
  ELASTIX_BINARY_DIR: $(Agent.BuildDirectory)/Elastix-build

trigger:
  paths:
    exclude:
    - '*.md'
    - LICENSE
    - .github/workflows/*
    - dox/doxygen/*
    - tools/*
pr:
  paths:
    exclude:
    - '*.md'
    - LICENSE
    - .github/workflows/*
    - dox/doxygen/*
    - tools/*

jobs:
- job: Windows
  timeoutInMinutes: 0
  pool:
    vmImage: 'windows-2022'
  strategy:
    matrix:
      ITKv5:
        itk.version: $(ITKv5_VERSION)
  steps:
  - script: |
      mkdir "$(ITK_BINARY_DIR)"
      mkdir "$(ELASTIX_BINARY_DIR)"
      mkdir externalproject-build
    displayName: 'Make build directories'
  - script: |
      python3 -m pip install --upgrade pip
      python3 -m pip install "torch==2.11.*" --index-url https://download.pytorch.org/whl/cpu
      python3 -c "import torch, pathlib; print('##vso[task.setvariable variable=Torch_DIR]' + (pathlib.Path(torch.utils.cmake_prefix_path) / 'Torch').as_posix())"
      python3 -c "import torch, pathlib; print('##vso[task.setvariable variable=TORCH_LIB_DIR]' + str(pathlib.Path(torch.__file__).parent / 'lib'))"
    displayName: 'Install LibTorch via pip'
  - script: |
      git clone $(ITK_GIT_URL) --branch $(itk.version) --depth 1 "$(ITK_SOURCE_DIR)"
    displayName: 'Clone ITK'
  - task: CMake@1
    displayName: 'CMake Generate ITK'
    inputs:
      cmakeArgs: -G "Visual Studio 17 2022" -T host=x64 -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DITK_LEGACY_REMOVE=ON "$(ITK_SOURCE_DIR)"
      workingDirectory: "$(ITK_BINARY_DIR)"
  - task: CMake@1
    displayName: 'CMake Build ITK'
    inputs:
      cmakeArgs: --build . --config Release -j 2
      workingDirectory: "$(ITK_BINARY_DIR)"
  - script: |
      git clone --depth 1 https://github.com/InsightSoftwareConsortium/ITKIMPACT.git "$(ITKIMPACT_SOURCE_DIR)"
    displayName: 'Clone ITKIMPACT backend'
  - task: CMake@1
    displayName: 'CMake Generate Elastix'
    inputs:
      cmakeArgs: -G "Visual Studio 17 2022" -T host=x64 -DITK_DIR="$(ITK_BINARY_DIR)" -DTorch_DIR="$(Torch_DIR)" -DBUILD_TESTING=ON -DELASTIX_USE_GTEST=ON -DITKIMPACT_INCLUDE_DIR="$(ITKIMPACT_SOURCE_DIR)/include" -DUSE_ALL_COMPONENTS=ON "$(ELASTIX_SOURCE_DIR)"
      workingDirectory: "$(ELASTIX_BINARY_DIR)"
  - task: CMake@1
    displayName: 'CMake Build Elastix'
    inputs:
      cmakeArgs: --build . --config Release -j 2
      workingDirectory: "$(ELASTIX_BINARY_DIR)"
  - task: CMake@1
    displayName: 'CMake Generate externalproject'
    inputs:
      cmakeArgs: -G "Visual Studio 17 2022" -T host=x64 -DElastix_DIR=$(ELASTIX_BINARY_DIR) "$(ELASTIX_SOURCE_DIR)/dox/externalproject"
      workingDirectory: $(Agent.BuildDirectory)/externalproject-build
  - task: CMake@1
    displayName: 'CMake Build externalproject'
    inputs:
      cmakeArgs: --build . --config Release
      workingDirectory: $(Agent.BuildDirectory)/externalproject-build
  # cmd rather than bash: the loader looks the LibTorch DLLs up on PATH, and PATH entries are
  # separated by ';' on Windows. Git Bash splits on ':' instead, which cuts a drive-qualified
  # directory such as C:/.../torch/lib into two entries and drops it on the way to the native
  # process, so the plugin fails to load with the DLLs sitting right where they were installed.
  - script: |
      set PATH=$(ELASTIX_BINARY_DIR)\bin\Release;$(TORCH_LIB_DIR);%PATH%
      .\Release\elastix_impact_metric_example.exe
    displayName: 'Run externalproject'
    workingDirectory: $(Agent.BuildDirectory)/externalproject-build
  - bash: python -m pip install -r "$(ELASTIX_SOURCE_DIR)/Testing/PythonTests/requirements.txt"
    displayName: 'Install PythonTests requirements'
  - script: |
      set PATH=$(ELASTIX_BINARY_DIR)\bin\Release;$(TORCH_LIB_DIR);%PATH%
      ctest -C Release -VV -j 2 -E "elastix_run_example_COMPARE_IM|elastix_run_3DCT_lung.MI.bspline.ASGD.001_COMPARE_TP"
    displayName: 'CTest Elastix'
    workingDirectory: $(ELASTIX_BINARY_DIR)
- job: Ubuntu
  timeoutInMinutes: 0
  pool:
    vmImage: 'ubuntu-22.04'
  strategy:
    matrix:
      ITKv5:
        itk.version: $(ITKv5_VERSION)
  steps:
  - script: |
      mkdir $(ITK_BINARY_DIR)
      mkdir $(ELASTIX_BINARY_DIR)
      mkdir externalproject-build
    displayName: 'Make build directories'
  - script: |
      python3 -m pip install --upgrade pip
      python3 -m pip install "torch==2.11.*" --index-url https://download.pytorch.org/whl/cpu
      python3 -c "import torch, pathlib; print('##vso[task.setvariable variable=Torch_DIR]' + (pathlib.Path(torch.utils.cmake_prefix_path) / 'Torch').as_posix())"
      python3 -c "import torch, pathlib; print('##vso[task.setvariable variable=TORCH_LIB_DIR]' + (pathlib.Path(torch.__file__).parent / 'lib').as_posix())"
    displayName: 'Install LibTorch via pip'
  - script: |
      git clone $(ITK_GIT_URL) --branch $(itk.version) --depth 1 "$(ITK_SOURCE_DIR)"
    displayName: 'Clone ITK'
  - task: CMake@1
    displayName: 'CMake Generate ITK'
    inputs:
      cmakeArgs: -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DITK_LEGACY_REMOVE=ON $(ITK_SOURCE_DIR)
      workingDirectory: $(ITK_BINARY_DIR)
  - task: CMake@1
    displayName: 'CMake Build ITK'
    inputs:
      cmakeArgs: --build . --config Release -j 2
      workingDirectory: $(ITK_BINARY_DIR)
  - script: |
      git clone --depth 1 https://github.com/InsightSoftwareConsortium/ITKIMPACT.git "$(ITKIMPACT_SOURCE_DIR)"
    displayName: 'Clone ITKIMPACT backend'
  - task: CMake@1
    displayName: 'CMake Generate Elastix'
    inputs:
      cmakeArgs: -DITK_DIR=$(ITK_BINARY_DIR) -DTorch_DIR="$(Torch_DIR)" -DBUILD_TESTING=ON -DELASTIX_USE_GTEST=ON -DITKIMPACT_INCLUDE_DIR="$(ITKIMPACT_SOURCE_DIR)/include" -DUSE_ALL_COMPONENTS=ON $(ELASTIX_SOURCE_DIR)
      workingDirectory: $(ELASTIX_BINARY_DIR)
  - task: CMake@1
    displayName: 'CMake Build Elastix'
    inputs:
      cmakeArgs: --build . --config Release -j 2
      workingDirectory: $(ELASTIX_BINARY_DIR)
  - task: CMake@1
    displayName: 'CMake Generate externalproject'
    inputs:
      cmakeArgs: -DElastix_DIR=$(Agent.BuildDirectory)/Elastix-build $(ELASTIX_SOURCE_DIR)/dox/externalproject
      workingDirectory: $(Agent.BuildDirectory)/externalproject-build
  - task: CMake@1
    displayName: 'CMake Build externalproject'
    inputs:
      cmakeArgs: --build .
      workingDirectory: $(Agent.BuildDirectory)/externalproject-build
  - bash: ./elastix_impact_metric_example
    workingDirectory: $(Agent.BuildDirectory)/externalproject-build
    displayName: 'Run externalproject'
  - bash: python -m pip install -r "$(ELASTIX_SOURCE_DIR)/Testing/PythonTests/requirements.txt"
    displayName: 'Install PythonTests requirements'
  - bash: ctest -C Release -VV -j 2 -E "elastix_run_example_COMPARE_IM|elastix_run_3DCT_lung.MI.bspline.ASGD.001_COMPARE_TP"
    displayName: 'CTest Elastix'
    workingDirectory: $(ELASTIX_BINARY_DIR)
- job: macOS
  timeoutInMinutes: 0
  pool:
    vmImage: 'macos-14'
  strategy:
    matrix:
      ITKv5:
        itk.version: $(ITKv5_VERSION)
  steps:
  - script: |
      mkdir $(ITK_BINARY_DIR)
      mkdir $(ELASTIX_BINARY_DIR)
      mkdir externalproject-build
      mkdir "$(Agent.BuildDirectory)/libtorch-build"
    displayName: 'Make build directories'
  # LibTorch is built from source here, and only here. This agent is x86_64 throughout, whatever
  # the macos-14 image name suggests: CMake reports host and target processor x86_64, finds no
  # NEON, and compiles SSE2 and SSE4. PyTorch publishes no macOS x86_64 wheel past 2.2.2, so
  # there is nothing to pip install and no interpreter choice changes that.
  #
  # Windows and Ubuntu take the wheel here, and so does macOS on GitHub Actions, where the same
  # image name is arm64 and torch-2.11.0-macosx_11_0_arm64 installs in seconds.
  #
  # Pinned to the release the other two platforms install, so all three compile against the same
  # headers. PyTorch's development branch already requires C++20, which elastix does not ask for.
  - script: |
      git clone --branch v2.11.0 --depth 1 --shallow-submodules --recursive https://github.com/pytorch/pytorch.git $(Agent.BuildDirectory)/pytorch
    displayName: 'Clone LibTorch'
  - script: |
      python3 -m venv $(Agent.BuildDirectory)/venv
      source $(Agent.BuildDirectory)/venv/bin/activate
      $(Agent.BuildDirectory)/venv/bin/python -m pip install -r $(Agent.BuildDirectory)/pytorch/requirements.txt
      cmake $(Agent.BuildDirectory)/pytorch -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$(Agent.BuildDirectory)/libtorch -DPython_EXECUTABLE=-DPython_EXECUTABLE=$(Agent.BuildDirectory)/venv/bin/python -DBUILD_PYTHON=OFF -DBUILD_TEST=OFF -DUSE_CUDA=OFF -DUSE_MPS=OFF -DUSE_MKLDNN=OFF -DUSE_QNNPACK=OFF -DUSE_XNNPACK=OFF -DUSE_FBGEMM=OFF
    workingDirectory: $(Agent.BuildDirectory)/libtorch-build
    displayName: 'CMake Generate LibTorch'
  - script: |
      source $(Agent.BuildDirectory)/venv/bin/activate
      ninja install
    workingDirectory: $(Agent.BuildDirectory)/libtorch-build
    displayName: 'CMake Build LibTorch'
  - script: |
      git clone $(ITK_GIT_URL) --branch $(itk.version) --depth 1 "$(ITK_SOURCE_DIR)"
    displayName: 'Clone ITK'
  - task: CMake@1
    displayName: 'CMake Generate ITK'
    inputs:
      cmakeArgs: -DBUILD_EXAMPLES=OFF -DBUILD_TESTING=OFF -DITK_LEGACY_REMOVE=ON $(ITK_SOURCE_DIR)
      workingDirectory: $(ITK_BINARY_DIR)
  - task: CMake@1
    displayName: 'CMake Build ITK'
    inputs:
      cmakeArgs: --build . --config Release -j 2
      workingDirectory: $(ITK_BINARY_DIR)
  - script: |
      git clone --depth 1 https://github.com/InsightSoftwareConsortium/ITKIMPACT.git "$(ITKIMPACT_SOURCE_DIR)"
    displayName: 'Clone ITKIMPACT backend'
  - task: CMake@1
    displayName: 'CMake Generate Elastix'
    inputs:
      cmakeArgs: -DITK_DIR=$(ITK_BINARY_DIR) -DTorch_DIR=$(Agent.BuildDirectory)/libtorch/share/cmake/Torch/ -DBUILD_TESTING=ON -DELASTIX_USE_GTEST=ON -DITKIMPACT_INCLUDE_DIR="$(ITKIMPACT_SOURCE_DIR)/include" -DUSE_ALL_COMPONENTS=ON $(Build.Repository.LocalPath)
      workingDirectory: $(ELASTIX_BINARY_DIR)
  - task: CMake@1
    displayName: 'CMake Build Elastix'
    inputs:
      cmakeArgs: --build . --config Release -j 2
      workingDirectory: $(ELASTIX_BINARY_DIR)
  - task: CMake@1
    displayName: 'CMake Generate externalproject'
    inputs:
      cmakeArgs: -DElastix_DIR=$(Agent.BuildDirectory)/Elastix-build $(ELASTIX_SOURCE_DIR)/dox/externalproject
      workingDirectory: $(Agent.BuildDirectory)/externalproject-build
  - task: CMake@1
    displayName: 'CMake Build externalproject'
    inputs:
      cmakeArgs: --build .
      workingDirectory: $(Agent.BuildDirectory)/externalproject-build
  - bash: ./elastix_impact_metric_example
    workingDirectory: $(Agent.BuildDirectory)/externalproject-build
    displayName: 'Run externalproject'
    # Note: On macOS, we have not yet found how to successfully install requirements.txt for Python, so for the time being, we skip the tests.
    # See also https://github.com/SuperElastix/elastix/issues/739
