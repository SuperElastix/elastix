name: ElastixPublish

on:
  workflow_dispatch:

env:
  DEFAULT_ITK_GIT_TAG: "v5.4.6"

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 3
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
        include:
          - os: ubuntu-22.04
            cuda_toolkit_version: '12.8.0'
            itk-git-tag: $DEFAULT_ITK_GIT_TAG
            c-compiler: "gcc"
            cxx-compiler: "g++"
            cmake-build-type: "Release"
            libs:
              - elastix-build/bin/libelx-ANNlib.so
          - os: windows-2022
            cuda_toolkit_version: '12.8.0'
            itk-git-tag: $DEFAULT_ITK_GIT_TAG
            c-compiler: "cl.exe"
            cxx-compiler: "cl.exe"
            cmake-build-type: "Release"
            libs:
              - elastix-build/bin/elx-ANNlib.dll
            vcvars64: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Auxiliary/Build/vcvars64.bat"
          - os: macos-14
            c-compiler: "clang"
            cxx-compiler: "clang++"
            itk-git-tag: $DEFAULT_ITK_GIT_TAG
            cmake-build-type: "Release"
            libs:
              - elastix-build/bin/libelx-ANNlib.dylib
    steps:
      - name: Free disk space
        if: matrix.os != 'windows-2022'
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune -af || true
          sudo rm -rf /var/lib/apt/lists/*
          echo "Disk after cleanup:"
          df -h
        shell: bash

      - name: Clone elastix
        uses: actions/checkout@v3

      - name: Make directory structure
        run: |
          items=(*)
          mkdir elastix-source
          mv ${items[*]} elastix-source
          mv .editorconfig elastix-source
          mv .clang-format elastix-source
          mv elastix-source/Dockerfile .
        shell: bash

      - name: Get specific version of CMake, Ninja
        uses: lukka/get-cmake@latest

      - name: Clone and build ITK
        uses: ./.github/actions/build_itk
        with:
          itk-git-tag: ${{ matrix.itk-git-tag }}
          c-compiler: ${{ matrix.c-compiler }}
          cxx-compiler: ${{ matrix.cxx-compiler }}
          cmake-build-type: ${{ matrix.cmake-build-type }}
          vcvars: ${{ matrix.vcvars64 }}

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"

      - name: Clone ITKIMPACT backend
        run: git clone --depth 1 https://github.com/InsightSoftwareConsortium/ITKIMPACT.git "${{ github.workspace }}/ITKIMPACT"
        shell: bash

      - name: Install LibTorch (CPU) via pip
        # LibTorch comes from the pip `torch` package (same as the ITKIMPACT backend), instead
        # of a standalone libtorch download / building PyTorch from source. torch 2.11 is used
        # (not 2.12) because it is the last series still shipping CUDA cu128 -- the widest GPU
        # coverage (Blackwell incl. RTX PRO 6000 + driver floor R570, and keeps older cards
        # unlike cu130). This CPU build produces the default (CPU) ImpactMetric; the CUDA variant
        # is rebuilt below. Export Torch_DIR for find_package(Torch); build_elastix reads it.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.11.*" --index-url https://download.pytorch.org/whl/cpu
          python - <<'PY' >> "$GITHUB_ENV"
          import torch, pathlib
          print("Torch_DIR=" + (pathlib.Path(torch.utils.cmake_prefix_path) / "Torch").as_posix())
          print("TORCH_LIB_DIR=" + (pathlib.Path(torch.__file__).parent / "lib").as_posix())
          PY

      - name: Configure/Build elastix with IMPACT libtorch cpu
        uses: ./.github/actions/build_elastix
        with:
          c-compiler: ${{ matrix.c-compiler }}
          cxx-compiler: ${{ matrix.cxx-compiler }}
          cmake-build-type: ${{ matrix.cmake-build-type }}
          vcvars: ${{ matrix.vcvars64 }}

      - name: Cleanup CPU torch (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mv elastix-build/bin/libImpactMetric.so elastix-build/bin/libImpactMetricCpu.so
          python -m pip uninstall -y torch
        shell: bash

      - name: Cleanup CPU torch [Windows]
        if: matrix.os == 'windows-2022'
        run: |
          mv elastix-build/bin/ImpactMetric.dll elastix-build/bin/ImpactMetricCpu.dll
          python -m pip uninstall -y torch
        shell: cmd

      - name: Install CUDA Toolkit (Windows)
        if: matrix.os == 'windows-2022'
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: ${{ matrix.cuda_toolkit_version }}
          use-github-cache: false
          use-local-cache: false

      - name: Install CUDA Toolkit (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: Jimver/cuda-toolkit@v0.2.23
        with:
          cuda: ${{ matrix.cuda_toolkit_version }}
          sub-packages: '["toolkit"]'
          method: 'network'

      - name: Install LibTorch (CUDA cu128) via pip
        # Reinstall torch as the cu128 build over the same site-packages path (Torch_DIR is
        # unchanged); the ImpactMetric target is then rebuilt against CUDA below. cu128 gives
        # Blackwell support (RTX PRO 6000 / RTX 50xx / B200) while keeping older cards.
        if: matrix.os != 'macos-14'
        shell: bash
        run: |
          python -m pip install "torch==2.11.*" --index-url https://download.pytorch.org/whl/cu128
          python - <<'PY' >> "$GITHUB_ENV"
          import torch, pathlib
          print("Torch_DIR=" + (pathlib.Path(torch.utils.cmake_prefix_path) / "Torch").as_posix())
          print("TORCH_LIB_DIR=" + (pathlib.Path(torch.__file__).parent / "lib").as_posix())
          PY

      - name: Build elastix with Impact Cuda (Windows)
        if: matrix.os == 'windows-2022'
        shell: cmd
        run: |
          cd elastix-build
          cmake -DCMAKE_C_COMPILER="${{ matrix.c-compiler }}" ^
              -DCMAKE_CXX_COMPILER="${{ matrix.cxx-compiler }}" ^
              -DCMAKE_BUILD_TYPE="${{ matrix.cmake-build-type }}" ^
              -DITK_DIR=../ITK-build ^
              -DCMAKE_CUDA_FLAGS="-allow-unsupported-compiler -Xcompiler \"/D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH\"" ^
              -DTorch_DIR=%Torch_DIR% ^
              -DITKIMPACT_INCLUDE_DIR=../ITKIMPACT/include ^
              -DUSE_ALL_COMPONENTS=ON ^
              -DBUILD_TESTING:BOOL=ON ^
              -DELASTIX_USE_GTEST=ON ^
              -GNinja ../elastix-source
          cmake --build . --target ImpactMetric
          mv bin/ImpactMetric.dll bin/ImpactMetricCuda.dll
          mv bin/ImpactMetricCpu.dll bin/ImpactMetric.dll


      - name: Build elastix with Impact Cuda (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          cd elastix-build
          cmake -DCMAKE_C_COMPILER="${{ matrix.c-compiler }}" \
              -DCMAKE_CXX_COMPILER="${{ matrix.cxx-compiler }}" \
              -DCMAKE_BUILD_TYPE="${{ matrix.cmake-build-type }}" \
              -DITK_DIR=../ITK-build \
              -DTorch_DIR=$Torch_DIR \
              -DITKIMPACT_INCLUDE_DIR=../ITKIMPACT/include \
              -DUSE_ALL_COMPONENTS=ON \
              -DBUILD_TESTING:BOOL=ON \
              -DELASTIX_USE_GTEST=ON \
              -GNinja ../elastix-source
          cmake --build . --target ImpactMetric
          mv bin/libImpactMetric.so bin/libImpactMetricCuda.so
          mv bin/libImpactMetricCpu.so bin/libImpactMetric.so


      - name: Publish
        uses: ./.github/actions/publish
        with:
          libs: ${{ join(matrix.libs, ' ') }} elastix-build/bin/*ImpactMetric*
          upload-name: ${{ matrix.os }}-torch-2.11-cu128
          docker-username: ${{ secrets.DOCKER_HUB_USERNAME }}
          docker-password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
